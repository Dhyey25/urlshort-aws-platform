name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

permissions:
  id-token: write   # required for OIDC
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.9.5

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::825765386578:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image metadata
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          IMAGE_URI=${{ steps.ecr-login.outputs.registry }}/urlshort-staging/app:$IMAGE_TAG
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image_uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

  terraform-plan-staging:
    name: Terraform Plan (staging)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::825765386578:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: infra/envs/staging
        run: terraform init

      - name: Terraform Plan
        working-directory: infra/envs/staging
        run: terraform plan -no-color
        # Image tag changes are ignored on the service, so plan
        # should be empty unless someone changed the infrastructure.

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [build-and-push, terraform-plan-staging]
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::825765386578:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Apply infrastructure changes
        working-directory: infra/envs/staging
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Run database migrations
        run: |
          ./scripts/run-migration.sh staging ${{ needs.build-and-push.outputs.image_uri }}

      - name: Update ECS service with new image
        run: |
          ./scripts/deploy-ecs.sh staging ${{ needs.build-and-push.outputs.image_uri }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster urlshort-staging-cluster \
            --services urlshort-staging-svc

      - name: Smoke test
        run: |
          ALB_DNS=$(cd infra/envs/staging && terraform output -raw -module=compute alb_dns_name)
          for i in {1..10}; do
            if curl -sf "http://$ALB_DNS/health"; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 6
          done
          echo "Smoke test failed"
          exit 1
